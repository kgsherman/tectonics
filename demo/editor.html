<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worldgen plate editor demo</title>
<style>
  :root {
    color-scheme: dark;
    --wg-bg: #0b0f14; --wg-panel: #121821; --wg-panel-2: #18202b; --wg-border: #243042;
    --wg-text: #d7e0ea; --wg-text-dim: #8b9bb0; --wg-accent: #4fa3ff; --wg-accent-2: #7fd1b9;
    --wg-danger: #ff6b6b; --wg-warn: #f5b942;
  }
  html, body { margin: 0; height: 100%; background: var(--wg-bg); color: var(--wg-text); font: 13px "Inter", system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
  #panel { border-right: 1px solid var(--wg-border); min-height: 0; overflow: hidden; }
  #viewport { position: relative; min-width: 0; min-height: 0; }
  .view { position: absolute; inset: 0; }
  #bar { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 3; }
  .seg { display: flex; background: rgba(11, 15, 20, .85); border: 1px solid var(--wg-border); border-radius: 8px; padding: 2px; gap: 2px; backdrop-filter: blur(4px); }
  .seg button { border: 0; background: transparent; color: var(--wg-text-dim); height: 28px; padding: 0 12px; border-radius: 6px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--wg-panel-2); color: var(--wg-text); box-shadow: inset 0 0 0 1px var(--wg-border); }
  #toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(18, 24, 33, .92); border: 1px solid var(--wg-border);
    border-radius: 8px; padding: 8px 14px; font-size: 12.5px; color: var(--wg-text); opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 3; }
  #toast.show { opacity: 1; }
  #boot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--wg-text-dim); font-size: 14px; }
  #boot.err { color: var(--wg-danger); padding: 24px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app">
  <div id="panel"></div>
  <div id="viewport">
    <div id="map" class="view"></div>
    <div id="globe" class="view" style="display:none"></div>
    <div id="bar">
      <div class="seg" id="viewSeg"><button data-v="map" class="on" title="2D map (M)">Map</button><button data-v="globe" title="3D globe (G)">Globe</button></div>
    </div>
    <div id="boot">Building mesh…</div>
    <div id="toast"></div>
  </div>
</div>
<script type="module" src="./editor.ts"></script>
</body>
</html>
